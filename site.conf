<Directory /var/www/html/c4.citycreator.com/www>
	# www/.htaccess runs .city files as PHP (AddType); this does it under PHP-FPM
	Use PHPExtension city

        # PHP settings: php.ini, next to this file (PHP-FPM)

	Options -Includes -ExecCGI
	AllowOverride all
</Directory>

<VirtualHost *:80>
	ServerName c4.citycreator.com
	ServerAlias castleford.citycreator.com

	DocumentRoot /var/www/html/c4.citycreator.com/www

	#Redirect permanent / https://c4.citycreator.com/
</VirtualHost>

#Include /var/www/html/c4.citycreator.com/ssl.conf
